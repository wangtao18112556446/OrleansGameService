services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orleans_game
      POSTGRES_USER: game
      POSTGRES_PASSWORD: game
    ports: ["${GAME_POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game -d orleans_game"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["${GAME_REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  orleans-schema:
    image: postgres:17-alpine
    entrypoint: ["/bin/sh", "/scripts/orleans-schema.sh"]
    volumes: ["./docker/orleans-schema.sh:/scripts/orleans-schema.sh:ro"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: orleans_game
      PGUSER: game
      PGPASSWORD: game
    depends_on:
      postgres: { condition: service_healthy }
  gateway:
    build:
      context: .
      dockerfile: src/GameServer.Gateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=orleans_game;Username=game;Password=game
      ConnectionStrings__Redis: redis:6379
      Jwt__SigningKey: replace-this-production-jwt-signing-key-with-a-secret-value
    ports: ["${GAME_GATEWAY_PORT:-8080}:8080"]
    depends_on:
      orleans-schema: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
volumes:
  postgres-data:
