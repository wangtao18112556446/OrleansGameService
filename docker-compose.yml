services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orleans_game
      POSTGRES_USER: game
      POSTGRES_PASSWORD: game
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game -d orleans_game"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  orleans-schema:
    image: postgres:17-alpine
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      apk add --no-cache curl
      for file in PostgreSQL-Main.sql PostgreSQL-Clustering.sql PostgreSQL-Persistence.sql; do
        case "$$file" in
          PostgreSQL-Main.sql) path="src/AdoNet/Shared/$$file" ;;
          PostgreSQL-Clustering.sql) path="src/AdoNet/Orleans.Clustering.AdoNet/$$file" ;;
          *) path="src/AdoNet/Orleans.Persistence.AdoNet/$$file" ;;
        esac
        curl --fail --location --retry 8 "https://raw.githubusercontent.com/dotnet/orleans/v10.2.1/$$path" | psql "$$POSTGRES_CONNECTION"
      done
    environment:
      POSTGRES_CONNECTION: Host=postgres;Port=5432;Database=orleans_game;Username=game;Password=game
    depends_on:
      postgres: { condition: service_healthy }
  gateway:
    build:
      context: .
      dockerfile: src/GameServer.Gateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=orleans_game;Username=game;Password=game
      ConnectionStrings__Redis: redis:6379
      Jwt__SigningKey: replace-this-production-jwt-signing-key-with-a-secret-value
    ports: ["8080:8080"]
    depends_on:
      orleans-schema: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
volumes:
  postgres-data:
