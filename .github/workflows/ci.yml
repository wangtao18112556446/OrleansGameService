name: Build and integration tests
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore OrleansGameService.slnx
      - run: dotnet build OrleansGameService.slnx --no-restore
      - run: dotnet tool restore
      - run: dotnet ef migrations has-pending-model-changes --project src/GameServer.Infrastructure --no-build
      - run: dotnet test OrleansGameService.slnx --no-build --logger 'trx;LogFileName=unit.trx'
      - name: Compose persistence and gateway restart tests
        shell: pwsh
        run: ./scripts/Test-Integration.ps1
      - name: Container diagnostics
        if: always()
        run: docker compose -p orleans-game-tests logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/TestResults/*.trx
            compose.log
      - name: Stop test services
        if: always()
        run: docker compose -p orleans-game-tests down
